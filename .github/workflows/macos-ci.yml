name: MacOS CI for Sagasu 3

on:
  push:
    branches:
      - main
      - master
      - "feature/**"
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build release binaries
        run: |
          chmod +x scripts/*.sh
          ./scripts/build.sh

      - name: Run test suite
        run: swift test

      - name: Build app bundle
        env:
          APP_VERSION: ci-${{ github.run_number }}
        run: ./scripts/build_app_bundle.sh

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sagasu-macos-build
          path: |
            build/*
            dist/*.app
